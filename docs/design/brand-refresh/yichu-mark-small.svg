  <rect x="11" y="12" width="18" height="18" rx="4" fill="#F4F8FF"/>
  <rect x="35" y="12" width="18" height="18" rx="4" fill="#F4F8FF"/>
  <rect x="11" y="36" width="18" height="18" rx="4" fill="#F4F8FF"/>
  <rect x="35" y="36" width="18" height="18" rx="4" fill="#FF927E"/>
</svg>
